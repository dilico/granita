version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"

    open-pull-requests-limit: 1
    rebase-strategy: disabled

    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["patch", "minor"]

      safe-updates:
        dependency-type: "production"
        update-types:
          - patch
          - minor

    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
